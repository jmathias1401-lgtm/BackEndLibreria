name: Java CI with Maven and SonarCloud

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: libreria_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: libreria_db
      DB_USER_NAME: root
      DB_PASSWORD: root
      SECRET_KEY: ${{ secrets.SECRET_KEY || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for SonarCloud analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build and Test with JaCoCo Coverage
        run: ./mvnw clean verify -DskipTests=false

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "Running SonarCloud analysis..."
            ./mvnw sonar:sonar -Dsonar.token="${SONAR_TOKEN}"
          else
            echo "::warning::SONAR_TOKEN secret is not set in GitHub repository secrets. Skipping SonarCloud scan."
          fi

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apinewfarma-package
          path: target/*.jar
          retention-days: 7

