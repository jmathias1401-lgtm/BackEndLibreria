# ===================================================================
# PERFIL DE PRODUCCIÓN: Credenciales obligatorias por entorno
# ===================================================================
server.port=${PORT:8080}

# Base de datos (Obligatorio en producción - sin valores por defecto)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway en producción (control estricto de esquema)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JPA en producción: no muestra SQL en consola y solo valida el esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Seguridad JWT (Obligatorio en producción)
secret-key=${SECRET_KEY}
jwt.expiration=${EXPIRATION:86400000}
refresh.expiration=${REFRESH_EXPIRATION:604800000}

# Almacenamiento
app.ruta-imagenes=${APP_RUTA_IMAGENES:/app/imagenes}

# Actuator seguro: no exponer detalles de componentes internos
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
