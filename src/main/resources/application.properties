server.port=${PORT:8080}
server.address=0.0.0.0

spring.application.name=app_newfarma

# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# ACTUATOR & HEALTH CHECK
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ==========================================
# BASE DE DATOS (Por defecto entorno local)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/libreria_db?serverTimezone=UTC}
spring.datasource.username=${DB_USER_NAME:root}
spring.datasource.password=${DB_PASSWORD:123}

# ==========================================
# FLYWAY MIGRACIONES
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# SEGURIDAD JWT (Valores inyectables por entorno)
# ==========================================
secret-key=${SECRET_KEY:c2VjcmV0a2V5Zm9ydGVzdGluZ2FuZHByb2plY3QxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
jwt.expiration=${EXPIRATION:86400000}
refresh.expiration=${REFRESH_EXPIRATION:604800000}

# ==========================================
# RUTA DE ALMACENAMIENTO DE IMÁGENES
# ==========================================
app.ruta-imagenes=${APP_RUTA_IMAGENES:D:/PROYECTOS/Libreria/newfarmafrontangular/src/assets/img/imagenes}
